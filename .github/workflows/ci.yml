name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm install`, not `npm ci`: package-lock.json is deliberately
      # gitignored for this prototype, and `npm ci` requires one. The
      # postinstall hook also fills in any missing placeholder art under
      # public/assets, which the build needs.
      - run: npm install

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
