<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Project H</title>
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Enough styling for the boot and failure states to be readable on
         their own. The real stylesheet is inside the JS bundle, so if the
         bundle never runs, none of it exists. */
      html, body { margin: 0; background: #0b0d12; color: #eef1f8; }
      body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .boot { padding: 2rem 1.5rem; max-width: 34rem; }
      .boot h1 { font-size: 1.15rem; margin: 0 0 .75rem; }
      .boot p { margin: 0 0 .75rem; color: #a8b0c8; }
      .boot pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
        background: #161a24; color: #e0654f; padding: .6rem .7rem; border-radius: 6px;
        white-space: pre-wrap; word-break: break-word; margin: 0;
      }
    </style>
    <!-- With scripting off, the "Starting..." placeholder is a lie: nothing
         is starting. Hide it so only the noscript explanation remains. -->
    <noscript><style>#boot-status { display: none; }</style></noscript>
  </head>
  <body>
    <!-- React replaces this on a successful boot. If you can still read it,
         the page loaded but the app never started. -->
    <div id="root">
      <div class="boot" id="boot-status">
        <h1>시작하는 중&hellip;</h1>
        <p>
          이 문구가 계속 보인다면 페이지는 열렸지만 코드가 실행되지 않은 것입니다.
          아이폰에서는 대개 파일 앱의 미리 보기로 열었을 때 그렇습니다
          &mdash; 미리 보기는 JavaScript를 실행하지 않습니다.
        </p>
      </div>
    </div>

    <noscript>
      <div class="boot">
        <h1>JavaScript가 꺼져 있습니다</h1>
        <p>
          이 게임은 JavaScript로 동작하므로 그것 없이는 아무것도 그릴 수 없습니다.
          아이폰 파일 앱에서 열었다면 그 미리 보기가 JavaScript를 막습니다
          &mdash; 브라우저에서 파일을 열어 주세요.
        </p>
      </div>
    </noscript>

    <script>
      // A crash inside the bundle would otherwise leave a blank page with no
      // way to see why, and there is no console on a phone. Show the error
      // instead. Classic (non-module) script so it runs everywhere, placed
      // before the bundle so it is listening during boot.
      (function () {
        var shown = false
        function report(what, detail) {
          if (shown) return
          // Once React has mounted it has replaced the boot placeholder. A
          // later error is not worth wiping a working game off the screen.
          if (!document.getElementById('boot-status')) return
          shown = true
          var el = document.getElementById('root') || document.body
          var box = document.createElement('div')
          box.className = 'boot'
          var h = document.createElement('h1')
          h.textContent = '게임을 시작할 수 없습니다'
          var p = document.createElement('p')
          p.textContent = what
          var pre = document.createElement('pre')
          pre.textContent = detail
          box.appendChild(h)
          box.appendChild(p)
          box.appendChild(pre)
          el.innerHTML = ''
          el.appendChild(box)
        }
        window.addEventListener('error', function (e) {
          report(
            '게임 코드에서 오류가 났습니다. 아래 내용을 전달해 주시면 고칠 수 있습니다.',
            (e && e.message ? e.message : '알 수 없는 오류') +
              (e && e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : '')
          )
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason
          report(
            '불러오는 중에 게임 코드에서 오류가 났습니다.',
            (r && (r.stack || r.message)) || String(r)
          )
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
